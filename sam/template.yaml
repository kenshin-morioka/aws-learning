# SAM テンプレートの骨格。
#
# TODO: リソース (Lambda / API Gateway / DynamoDB など) は Resources 以下に実装していく。
# アーキテクチャは自由に設計してよい。
#
# 検証コマンド (リポジトリルートから実行する場合):
#   sam validate --lint --template-file sam/template.yaml
#     … cfn-lint によるローカル検証。AWS API を呼ばずオフラインで完結する (学習フローはこちら)
#   sam validate --template-file sam/template.yaml
#     … 基本検証のみだが IAM クライアントを作成するため AWS 認証情報とリージョン設定が必要

AWSTemplateFormatVersion: "2010-09-09"

# Transform = このテンプレートを「SAM 記法」として解釈させる宣言。
# AWS::Serverless::* という短縮記法が、デプロイ時に素の CloudFormation リソースへ展開される
Transform: AWS::Serverless-2016-10-31

Description: >
  AWS IaC 学習用の SAM テンプレート (骨格)。
  このリポジトリは AWS へデプロイしない学習環境。

Resources:
  # プレースホルダ: CloudFormation は Resources を空にできないため、
  # 最小の Lambda 関数を定義している。実装を始めたら自由に置き換えてよい。
  #
  # --- パターン1: マネージドランタイム (Python) ---
  # AWS がランタイムを管理してくれる標準的な形。まずはこちらが基本
  HelloFunction:
    Type: AWS::Serverless::Function
    Metadata:
      # checkov が指摘する下記 3 点は本来設計すべき項目だが、学習用プレースホルダの
      # ため理由を明記した上でスキップする。本実装では各項目を設計判断すること
      checkov:
        skip:
          - id: CKV_AWS_115 # 同時実行数制限: 暴走や下流サービス保護のための上限設定
            comment: "learning placeholder"
          - id: CKV_AWS_116 # DLQ: 失敗イベントを退避して調査・再処理できるようにする
            comment: "learning placeholder"
          - id: CKV_AWS_117 # VPC 配置: プライベートリソースへ安全にアクセスするため
            comment: "learning placeholder"
    Properties:
      CodeUri: src/hello/ # コードの場所 (ディレクトリ)
      Handler: app.lambda_handler # <ファイル名>.<関数名>
      Runtime: python3.13

  # --- パターン2: カスタムランタイム (Rust) ---
  # 実行メモリを最小に抑えたい・コールドスタートを速くしたいケース向け。
  # コンパイル済みバイナリを provided.al2023 (OS だけの素のランタイム) で動かす
  HelloRustFunction:
    Type: AWS::Serverless::Function
    Metadata:
      # sam build に「cargo-lambda でビルドする」ことを伝える設定
      BuildMethod: rust-cargolambda
      # HelloFunction と同じ理由で学習用プレースホルダとしてスキップ
      checkov:
        skip:
          - id: CKV_AWS_115
            comment: "learning placeholder"
          - id: CKV_AWS_116
            comment: "learning placeholder"
          - id: CKV_AWS_117
            comment: "learning placeholder"
    Properties:
      CodeUri: src/hello-rust/ # Cargo.toml があるディレクトリ
      Handler: bootstrap # カスタムランタイムでは固定値 (バイナリ名)
      Runtime: provided.al2023
      MemorySize: 128 # 最小メモリ。Rust なら 128MB でも十分動く
